[project]
name = "snippetvault"
version = "0.8.0"
description = "A CLI tool to store your thoughts and notes."
readme = "README.md"
authors = [
    { name = "SaruboDev", email = "SaruboDev@users.noreply.github.com" }
]
requires-python = ">=3.14.3"
dependencies = [
    "tomlkit>=0.15.1",
]

[project.optional-dependencies]
cli = [
    "typer>=0.27.0"
]

[project.scripts]
snippetvault = "snippetvault.cli:app"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
